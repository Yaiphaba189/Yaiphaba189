name: Update stats
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/**", ".github/workflows/stats.yml"]
jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats
        run: python .github/scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "Yaiphaba189"
          git config user.email "63526955+Yaiphaba189@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: update stats" && git push
